<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title + Description -->
    <title>Poortjie Requests | Tuktuk</title>
    <meta name="description" content="Request a tuktuk ride or delivery in Poortjie. Enter your pickup and destination, and the operator will review your request, set a price, and assign a driver.">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 10px; }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased">

<!-- Loader -->
<div id="loader-overlay" class="fixed inset-0 bg-white dark:bg-slate-900 z-50 flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="animate-spin h-10 w-10 border-4 border-green-500 border-t-transparent rounded-full mb-4"></div>
    <p class="text-xs font-black uppercase tracking-widest animate-pulse">Connecting to Kasilayn...</p>
</div>

<!-- Header -->
<header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">

        <button onclick="window.history.back()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <i class="fas fa-arrow-left"></i>
        </button>

        <div id="user-avatar" class="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/30 border border-green-200 dark:border-green-800 flex items-center justify-center text-green-700 dark:text-green-400 font-bold overflow-hidden">
            <span id="user-initial">?</span>
        </div>
    </div>
</header>

<main class="max-w-xl mx-auto p-4 space-y-6 pb-24">

    <!-- Large Logo Section -->
    <div class="pt-10 pb-4 text-center">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-white dark:bg-slate-800 rounded-[2.5rem] shadow-2xl mb-6 border border-slate-100 dark:border-slate-700 transform -rotate-6">
            <img src="./favicon/favicon-96x96.png" class="w-14 h-14" alt="logo">
        </div>
        <h1 class="text-5xl font-black tracking-tight">Poortjie<br><span class="text-green-600">Requests</span></h1>
        <div class="mt-4 inline-block bg-green-500/10 text-green-600 dark:text-green-400 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.3em]">
            Kasilayn Operator
        </div>
    </div>

    <!-- Description -->
    <div class="text-center px-4">
        <p class="text-sm text-slate-500 dark:text-slate-400 font-medium">
            Request a ride or delivery. Enter your pickup and destination, and we’ll connect you with a driver.
        </p>
    </div>

    <!-- Booking Form -->
    <div class="bg-white dark:bg-slate-800 rounded-[2.5rem] shadow-xl border border-slate-200 dark:border-slate-700 p-8">
        <h2 class="text-2xl font-black mb-6">Request a Ride</h2>

        <form id="booking-form" class="space-y-5">

            <div>
                <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 ml-1">
                    Pickup Location
                </label>
                <div class="relative">
                    <i class="fas fa-location-dot absolute left-5 top-1/2 -translate-y-1/2 text-red-500"></i>
                    <input type="text" id="pickup-input" required placeholder="Where are you?"
                           class="w-full pl-12 pr-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 ml-1">
                    Destination
                </label>
                <div class="relative">
                    <i class="fas fa-flag-checkered absolute left-5 top-1/2 -translate-y-1/2 text-green-500"></i>
                    <input type="text" id="destination-input" required placeholder="Where are you going?"
                           class="w-full pl-12 pr-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm">
                </div>
            </div>

            <button type="submit" id="submit-btn"
                    class="w-full py-5 bg-green-600 hover:bg-green-700 text-white font-black uppercase tracking-[0.2em] text-xs rounded-2xl shadow-xl shadow-green-500/20 transition-all transform active:scale-95 flex items-center justify-center gap-2 mt-2">
                <i class="fas fa-paper-plane"></i>
                <span>Book Now</span>
            </button>

        </form>
    </div>

    <div class="flex items-center gap-4 py-4">
        <div class="h-[1px] flex-grow bg-slate-200 dark:bg-slate-700"></div>
        <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Recent Activity</span>
        <div class="h-[1px] flex-grow bg-slate-200 dark:bg-slate-700"></div>
    </div>

    <div id="bookings-list" class="space-y-4 text-center py-10 opacity-50 custom-scrollbar max-h-[400px] overflow-y-auto pr-1">
        <div class="animate-spin h-6 w-6 border-2 border-green-500 border-t-transparent rounded-full mx-auto mb-2"></div>
        <p class="text-xs font-bold uppercase tracking-widest">Loading history...</p>
    </div>

</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../../scripts/firebase.js"></script>

<script>
    const bookingForm = document.getElementById('booking-form');
    const bookingsList = document.getElementById('bookings-list');
    const userInitial = document.getElementById('user-initial');
    const userAvatar = document.getElementById('user-avatar');
    const loader = document.getElementById('loader-overlay');

    const PATHS = {
        ROOT_COLLECTION: "kasilayn",
        ROOT_DOCUMENT: "poortjieOperator",
        BOOKINGS: "bookings"
    };

    const getBookingsRef = () => db.collection(PATHS.ROOT_COLLECTION)
                                  .doc(PATHS.ROOT_DOCUMENT)
                                  .collection(PATHS.BOOKINGS);

    firebase.auth().onAuthStateChanged(async user => {
        if (!user) {
            sessionStorage.setItem('redirectUrl', window.location.href);
            window.location.href = '../../authentication/login.html';
            return;
        }

        const name = user.displayName || user.email.split('@')[0];
        userInitial.textContent = name.charAt(0).toUpperCase();

        if (user.photoURL) {
            userAvatar.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
        }

        subscribeToBookings(user.uid);
    });

    function subscribeToBookings(userId) {
        getBookingsRef()
            .where('userId', '==', userId)
            .orderBy('createdAt', 'desc')
            .onSnapshot(snapshot => {

                if (loader) {
                    loader.classList.add('opacity-0');
                    setTimeout(() => loader.remove(), 300);
                }

                renderBookings(snapshot);
            }, error => {
                console.error(error);
                bookingsList.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-2xl text-xs font-bold uppercase tracking-widest">Error loading bookings</div>`;
                if (loader) loader.remove();
            });
    }

    function renderBookings(snapshot) {
        if (snapshot.empty) {
            bookingsList.innerHTML = `
                <div class="py-10 text-center opacity-30">
                    <i class="fas fa-taxi text-4xl mb-4"></i>
                    <p class="text-xs font-black uppercase tracking-widest">No rides yet. Request your first one above!</p>
                </div>
            `;
            return;
        }

        bookingsList.innerHTML = '';
        snapshot.forEach(doc => {
            const b = doc.data();
            const div = document.createElement('div');
            div.className = "p-5 bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between text-left";

            const status = b.status || 'PENDING_OWNER_REVIEW';

            div.innerHTML = `
                <div class="flex flex-col gap-1">
                    <p class="text-sm font-black uppercase tracking-tight">
                        <span class="text-red-500">${b.pickupLocation?.name || 'Unknown'}</span>
                        <span class="opacity-20 mx-1">→</span>
                        <span class="text-green-600">${b.destinationLocation?.name || 'Unknown'}</span>
                    </p>
                    <p class="text-[9px] font-black uppercase tracking-widest opacity-40">${status.replace(/_/g, ' ')}</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-900 flex items-center justify-center text-slate-400">
                    <i class="fas fa-chevron-right text-[10px]"></i>
                </div>
            `;
            bookingsList.appendChild(div);
        });
    }

    bookingForm.onsubmit = async (e) => {
        e.preventDefault();
        const user = firebase.auth().currentUser;
        if (!user) return;

        const pickupInput = document.getElementById('pickup-input');
        const destinationInput = document.getElementById('destination-input');

        const pickupVal = pickupInput.value.trim();
        const destinationVal = destinationInput.value.trim();

        if (!pickupVal || !destinationVal) return;

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> <span>Processing...</span>`;

        try {
            // Consistent name retrieval
            let userName = user.displayName || user.email.split('@')[0];
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().displayName) {
                userName = userDoc.data().displayName;
            }

            await getBookingsRef().add({
                userId: user.uid,
                userName: userName,
                pickupLocation: { name: pickupVal, latitude: 0.0, longitude: 0.0 },
                destinationLocation: { name: destinationVal, latitude: 0.0, longitude: 0.0 },
                status: 'PENDING_OWNER_REVIEW',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            bookingForm.reset();
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-paper-plane"></i> <span>Book Now</span>`;
        }
    };
</script>

</body>
</html>
