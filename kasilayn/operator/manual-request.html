<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Request Panel - Poortjie Services</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased">

    <!-- Loader -->
    <div id="loader-overlay" class="fixed inset-0 bg-white dark:bg-slate-900 z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="animate-spin h-10 w-10 border-4 border-green-500 border-t-transparent rounded-full mb-4"></div>
        <p class="text-xs font-black uppercase tracking-widest animate-pulse">Initializing Panel...</p>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-8 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                <div>
                    <h3 class="text-2xl font-black tracking-tight">Trip Details</h3>
                    <p id="modal-booking-id" class="text-[9px] font-black uppercase tracking-widest opacity-30 mt-1"></p>
                </div>
                <button onclick="closeModal()" class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-red-500 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-8 overflow-y-auto custom-scrollbar space-y-8">
                <!-- Status & Price Badge -->
                <div class="flex justify-between items-center">
                    <span id="modal-status" class="px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest text-white"></span>
                    <span id="modal-price" class="text-2xl font-black text-green-600"></span>
                </div>

                <!-- Requester Info -->
                <div class="space-y-4">
                    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Requester</h4>
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-xl">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <p id="modal-name" class="font-black text-lg"></p>
                            <p id="modal-phone" class="text-sm font-bold opacity-50"></p>
                        </div>
                    </div>
                </div>

                <!-- Route Info -->
                <div class="space-y-4">
                    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Route</h4>
                    <div class="space-y-3">
                        <div class="flex gap-4">
                            <i class="fas fa-location-dot text-red-500 mt-1"></i>
                            <div>
                                <p class="text-[10px] font-black uppercase opacity-40">Pickup</p>
                                <p id="modal-pickup" class="font-bold"></p>
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <i class="fas fa-flag-checkered text-green-500 mt-1"></i>
                            <div>
                                <p class="text-[10px] font-black uppercase opacity-40">Destination</p>
                                <p id="modal-destination" class="font-bold"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Assignment Info -->
                <div class="space-y-4">
                    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Assignment</h4>
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-xl">
                            <i class="fas fa-id-card"></i>
                        </div>
                        <div>
                            <p id="modal-driver" class="font-black"></p>
                            <p id="modal-driver-id" class="text-[10px] font-bold opacity-30"></p>
                        </div>
                    </div>
                </div>

                <!-- Metadata Info -->
                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                    <div>
                        <p class="text-[10px] font-black uppercase opacity-40">Booked At</p>
                        <p id="modal-time" class="text-sm font-bold"></p>
                    </div>
                    <div>
                        <p class="text-[10px] font-black uppercase opacity-40">Reason</p>
                        <p id="modal-reason" class="text-sm font-bold"></p>
                    </div>
                </div>
            </div>

            <div class="p-8 bg-slate-50 dark:bg-slate-900/50 flex gap-4">
                <a id="modal-call-btn" href="#" class="flex-grow py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black uppercase text-xs tracking-widest flex items-center justify-center gap-2 transition shadow-xl shadow-blue-500/20">
                    <i class="fas fa-phone"></i>
                    Call Requester
                </a>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="window.history.back()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div id="user-avatar" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold overflow-hidden border border-slate-200 dark:border-slate-700 text-[10px] uppercase">
                <span id="user-initial">OP</span>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 pb-24 space-y-8">

        <!-- Large Logo Section -->
        <div class="pt-10 pb-4 text-center">
            <div class="flex justify-center mb-6">
                <img src="./logo/tuktuk.png"
                     alt="Tuktuk Logo"
                     class="w-1/3 max-w-[180px] min-w-[120px] object-contain">
            </div>
            <h1 class="text-5xl font-black tracking-tight">Manual<br><span class="text-green-600">Booking</span></h1>
            <div class="mt-4 inline-block bg-green-500/10 text-green-600 dark:text-green-400 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.3em]">
                Operator Control
            </div>
        </div>

        <!-- Stats Card -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-700 text-center">
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Total Trips</p>
                <h3 id="stat-total-trips" class="text-2xl font-black">0</h3>
            </div>
            <div class="bg-white dark:bg-slate-800 p-6 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-700 text-center">
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Total Revenue</p>
                <h3 id="stat-total-revenue" class="text-2xl font-black text-green-600">R 0</h3>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-[2.5rem] shadow-xl border border-slate-200 dark:border-slate-700 p-8 space-y-8">
            <div class="text-center sm:text-left">
                <h2 class="text-2xl font-black">Trip Details</h2>
                <p class="text-xs font-bold uppercase tracking-widest opacity-40 mt-1">Create a booking for a caller manually.</p>
            </div>

            <form id="manual-booking-form" class="space-y-6">
                <!-- Requester Info -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Requester Name</label>
                        <input type="text" id="requester-name" required placeholder="John Doe"
                               class="w-full px-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm">
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Phone Number</label>
                        <input type="tel" id="requester-phone" required placeholder="071 234 5678"
                               class="w-full px-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm">
                    </div>
                </div>

                <!-- Locations -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Pickup</label>
                        <div class="relative">
                            <i class="fas fa-location-dot absolute left-5 top-1/2 -translate-y-1/2 text-red-500"></i>
                            <input type="text" id="pickup" required placeholder="Fetching from..."
                                   class="w-full pl-12 pr-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Destination</label>
                        <div class="relative">
                            <i class="fas fa-flag-checkered absolute left-5 top-1/2 -translate-y-1/2 text-green-500"></i>
                            <input type="text" id="destination" required placeholder="Dropping off at..."
                                   class="w-full pl-12 pr-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm">
                        </div>
                    </div>
                </div>

                <!-- Driver & Price -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Assign Driver (Optional)</label>
                        <div class="relative">
                            <i class="fas fa-id-card absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <select id="driver-select" class="w-full pl-12 pr-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm appearance-none">
                                <option value="">Select Driver</option>
                                <!-- Drivers will be loaded here -->
                            </select>
                        </div>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Agreed Price (R)</label>
                        <div class="relative">
                            <span class="absolute left-5 top-1/2 -translate-y-1/2 font-black opacity-30 text-sm">R</span>
                            <input type="number" id="price" required placeholder="0.00" step="0.01"
                                   class="w-full pl-10 pr-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-black text-sm">
                        </div>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Reason (Optional)</label>
                        <input type="text" id="reason" placeholder="e.g. School Run"
                               class="w-full px-5 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-green-500 outline-none transition font-bold text-sm">
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                        class="w-full py-5 bg-green-600 hover:bg-green-700 text-white font-black uppercase tracking-[0.2em] text-xs rounded-2xl shadow-xl shadow-green-500/20 transition-all transform active:scale-95 flex items-center justify-center gap-2 mt-2">
                    <i class="fas fa-plus-circle"></i>
                    <span>Create Manual Trip</span>
                </button>
            </form>
        </div>

        <div id="status-message" class="hidden p-5 rounded-[2rem] text-center font-black text-xs uppercase tracking-widest shadow-lg border-2"></div>

        <!-- History Section -->
        <div class="bg-white dark:bg-slate-800 rounded-[2.5rem] shadow-xl border border-slate-200 dark:border-slate-700 p-8 space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-2xl font-black uppercase tracking-tight">Booking History</h2>

                <div class="flex gap-2 w-full sm:w-auto">
                    <input type="date" id="filter-date" class="flex-grow sm:flex-none px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-[10px] font-black uppercase outline-none focus:ring-2 focus:ring-green-500">
                    <select id="filter-driver" class="flex-grow sm:flex-none px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-[10px] font-black uppercase outline-none focus:ring-2 focus:ring-green-500">
                        <option value="ALL">All Drivers</option>
                    </select>
                </div>
            </div>

            <div id="history-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                <div class="text-center py-12 opacity-30 italic text-sm">
                    Loading history...
                </div>
            </div>
        </div>

    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../../scripts/firebase.js"></script>

    <script>
        const bookingForm = document.getElementById('manual-booking-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-message');
        const loader = document.getElementById('loader-overlay');
        const driverSelect = document.getElementById('driver-select');
        const historyList = document.getElementById('history-list');
        const filterDriver = document.getElementById('filter-driver');
        const filterDate = document.getElementById('filter-date');

        // Modal elements
        const detailsModal = document.getElementById('details-modal');

        let drivers = [];
        let allBookings = [];

        // Constants matching Android App's FirebasePaths
        const PATHS = {
            USERS: "users",
            ROOT_COLLECTION: "kasilayn",
            ROOT_DOCUMENT: "poortjieOperator",
            BOOKINGS: "bookings"
        };

        const getUsersRef = () => db.collection(PATHS.USERS);
        const getBookingsRef = () => db.collection(PATHS.ROOT_COLLECTION)
                                      .doc(PATHS.ROOT_DOCUMENT)
                                      .collection(PATHS.BOOKINGS);

        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                sessionStorage.setItem('redirectUrl', window.location.href);
                window.location.href = '../../authentication/login.html';
                return;
            }

            const name = user.displayName || user.email.split('@')[0];
            document.getElementById('user-initial').textContent = name.charAt(0).toUpperCase();

            loadDrivers();
            observeHistory();

            if (loader) {
                loader.classList.add('opacity-0');
                setTimeout(() => loader.remove(), 300);
            }
        });

        async function loadDrivers() {
            try {
                // Matching logic from UserRepositoryImpl.kt: roles.tuktuk.isDriver == true
                const snap = await getUsersRef()
                    .where('roles.tuktuk.isDriver', '==', true)
                    .get();

                drivers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Clear and add default
                driverSelect.innerHTML = '<option value="">Select Driver</option>';

                drivers.forEach(driver => {
                    const opt = document.createElement('option');
                    opt.value = driver.id;
                    opt.textContent = `${driver.displayName || 'Unnamed Driver'}`;
                    driverSelect.appendChild(opt);

                    const filterOpt = document.createElement('option');
                    filterOpt.value = driver.id;
                    filterOpt.textContent = driver.displayName || 'Unnamed Driver';
                    filterDriver.appendChild(filterOpt);
                });

                // Re-render history if drivers load late to populate any assignment selects
                if (allBookings.length > 0) renderHistory();
            } catch (e) {
                console.error("Error loading drivers:", e);
            }
        }

        function observeHistory() {
            getBookingsRef()
                .orderBy('createdAt', 'desc')
                .limit(100)
                .onSnapshot(snapshot => {
                    allBookings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderHistory();
                });
        }

        // Global assign driver function
        window.assignDriver = async (e, bookingId, driverId) => {
            e.stopPropagation(); // Prevent modal from opening
            if (!driverId) return;
            const driver = drivers.find(d => d.id === driverId);
            if (!driver) return;

            if (!confirm(`Assign ${driver.displayName || 'this driver'} to this trip?`)) return;

            try {
                await getBookingsRef().doc(bookingId).update({
                    assignedDriverId: driverId,
                    assignedDriverName: driver.displayName || "Driver",
                    status: 'ASSIGNED_TO_DRIVER',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showStatus("Driver assigned successfully!", "success");
            } catch (e) {
                console.error("Error assigning driver:", e);
                showStatus("Error: " + e.message, "error");
            }
        };

        function renderHistory() {
            const driverIdFilter = filterDriver.value;
            const dateStr = filterDate.value;

            let filtered = allBookings;

            if (driverIdFilter !== 'ALL') {
                filtered = filtered.filter(b => b.assignedDriverId === driverIdFilter);
            }

            if (dateStr) {
                filtered = filtered.filter(b => {
                    if (!b.createdAt) return false;
                    const d = new Date(b.createdAt.seconds * 1000);
                    const iso = d.toISOString().split('T')[0];
                    return iso === dateStr;
                });
            }

            if (filtered.length === 0) {
                historyList.innerHTML = `<div class="text-center py-12 opacity-30 italic text-sm">No matching bookings found.</div>`;
                updateStats(0, 0);
                return;
            }

            let totalMoney = 0;
            historyList.innerHTML = '';

            filtered.forEach(trip => {
                const isCompleted = trip.status === 'COMPLETED';
                const isFinal = ['COMPLETED', 'CANCELLED', 'REJECTED_BY_USER'].includes(trip.status);
                const fare = trip.price || 0;
                if (isCompleted) totalMoney += fare;

                const date = trip.createdAt ? new Date(trip.createdAt.seconds * 1000).toLocaleDateString() : 'Pending';

                const div = document.createElement('div');
                div.className = "p-4 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-100 dark:border-slate-800 space-y-2 cursor-pointer hover:border-green-500/50 transition-all";
                div.onclick = () => showBookingDetails(trip.id);

                // Logic for assignment UI
                let driverInfo = '';
                if (!trip.assignedDriverId && !isFinal) {
                    driverInfo = `
                        <select onchange="window.assignDriver(event, '${trip.id}', this.value)"
                                class="text-[9px] font-black uppercase bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 outline-none focus:ring-2 focus:ring-green-500 transition-all appearance-none">
                            <option value="">Quick Assign</option>
                            ${drivers.map(d => `<option value="${d.id}">${d.displayName || 'Driver'}</option>`).join('')}
                        </select>
                    `;
                } else {
                    driverInfo = `<span class="text-slate-900 dark:text-white">${trip.assignedDriverName || 'Unassigned'}</span>`;
                }

                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-sm font-black uppercase tracking-tight">${trip.userName || 'Anonymous'}</h4>
                            <p class="text-[10px] font-bold opacity-50">${date}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest text-white ${getStatusColor(trip.status)}">
                            ${trip.status.replace(/_/g, ' ')}
                        </span>
                    </div>
                    <div class="text-xs font-bold opacity-70">
                        <span class="text-red-500">${trip.pickupLocation?.name || "Unknown"}</span>
                        <span class="mx-1">→</span>
                        <span class="text-green-600">${trip.destinationLocation?.name || "Unknown"}</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-200/50 dark:border-slate-700/50">
                        <p class="text-[9px] font-black uppercase opacity-40 flex items-center gap-2">
                            Driver: ${driverInfo}
                        </p>
                        <p class="text-sm font-black text-green-600">R ${fare.toFixed(2)}</p>
                    </div>
                `;
                historyList.appendChild(div);
            });

            updateStats(filtered.length, totalMoney);
        }

        function getStatusColor(status) {
            // Colors matching Android BookingStatus enum
            switch (status) {
                case 'PENDING_OWNER_REVIEW': return 'bg-yellow-500';
                case 'PENDING_USER_CONFIRMATION': return 'bg-orange-500';
                case 'READY_FOR_ASSIGNMENT': return 'bg-amber-500';
                case 'ASSIGNED_TO_DRIVER': return 'bg-blue-500';
                case 'COMPLETED': return 'bg-emerald-600';
                case 'CANCELLED': return 'bg-red-500';
                case 'REJECTED_BY_USER': return 'bg-red-700';
                default: return 'bg-slate-400';
            }
        }

        function updateStats(count, money) {
            document.getElementById('stat-total-trips').textContent = count;
            document.getElementById('stat-total-revenue').textContent = `R ${money.toFixed(2)}`;
        }

        filterDriver.onchange = renderHistory;
        filterDate.onchange = renderHistory;

        // Modal functions
        window.showBookingDetails = (bookingId) => {
            const trip = allBookings.find(b => b.id === bookingId);
            if (!trip) return;

            document.getElementById('modal-booking-id').textContent = `ID: ${trip.id}`;
            document.getElementById('modal-status').textContent = trip.status.replace(/_/g, ' ');
            document.getElementById('modal-status').className = `px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest text-white ${getStatusColor(trip.status)}`;
            document.getElementById('modal-price').textContent = `R ${(trip.price || 0).toFixed(2)}`;
            document.getElementById('modal-name').textContent = trip.userName || 'Anonymous';
            document.getElementById('modal-phone').textContent = trip.userPhone || 'No phone recorded';
            document.getElementById('modal-pickup').textContent = trip.pickupLocation?.name || 'Unknown';
            document.getElementById('modal-destination').textContent = trip.destinationLocation?.name || 'Unknown';
            document.getElementById('modal-driver').textContent = trip.assignedDriverName || 'Unassigned';
            document.getElementById('modal-driver-id').textContent = trip.assignedDriverId ? `UID: ${trip.assignedDriverId}` : '';

            const bookedAt = trip.createdAt ? new Date(trip.createdAt.seconds * 1000).toLocaleString() : 'Pending';
            document.getElementById('modal-time').textContent = bookedAt;
            document.getElementById('modal-reason').textContent = trip.reason || 'None provided';

            const callBtn = document.getElementById('modal-call-btn');
            if (trip.userPhone) {
                callBtn.href = `tel:${trip.userPhone}`;
                callBtn.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                callBtn.href = "#";
                callBtn.classList.add('opacity-50', 'pointer-events-none');
            }

            detailsModal.classList.remove('hidden');
        };

        window.closeModal = () => {
            detailsModal.classList.add('hidden');
        };

        bookingForm.onsubmit = async (e) => {
            e.preventDefault();

            const user = firebase.auth().currentUser;
            if (!user) return;

            const name = document.getElementById('requester-name').value.trim();
            const phone = document.getElementById('requester-phone').value.trim();
            const pickup = document.getElementById('pickup').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const reason = document.getElementById('reason').value.trim();
            const selectedDriverId = driverSelect.value;

            if (!name || !phone || !pickup || !destination || isNaN(price)) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> <span>Processing...</span>`;

            try {
                const now = firebase.firestore.FieldValue.serverTimestamp();
                const selectedDriver = drivers.find(d => d.id === selectedDriverId);

                // Aligning with com.digilayn.poortjieoperator.domain.model.Booking
                const bookingData = {
                    userId: "MANUAL_" + phone.replace(/\s+/g, ''),
                    userName: name,
                    userPhone: phone, // Added phone field as requested
                    reason: reason,   // Added reason field as requested
                    pickupLocation: {
                        name: pickup,
                        latitude: 0.0,
                        longitude: 0.0
                    },
                    destinationLocation: {
                        name: destination,
                        latitude: 0.0,
                        longitude: 0.0
                    },
                    price: price,
                    status: selectedDriverId ? 'ASSIGNED_TO_DRIVER' : 'READY_FOR_ASSIGNMENT',
                    assignedDriverId: selectedDriverId || null,
                    assignedDriverName: selectedDriver ? (selectedDriver.displayName || "Driver") : null,
                    createdAt: now,
                    updatedAt: now
                };

                await getBookingsRef().add(bookingData);

                showStatus("Trip created successfully!" + (selectedDriverId ? " Assigned to " + bookingData.assignedDriverName : " Awaiting review."), "success");
                bookingForm.reset();
            } catch (error) {
                console.error("Manual booking error:", error);
                showStatus("Error: " + error.message, "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fas fa-plus-circle"></i> <span>Create Manual Trip</span>`;
            }
        };

        function showStatus(text, type) {
            statusMsg.textContent = text;
            if (type === 'success') {
                statusMsg.className = "mt-6 p-5 rounded-[2rem] text-center font-black text-xs uppercase tracking-widest shadow-lg border-2 bg-green-50 border-green-200 text-green-700 dark:bg-green-900/20 dark:border-green-800 dark:text-green-400";
            } else {
                statusMsg.className = "mt-6 p-5 rounded-[2rem] text-center font-black text-xs uppercase tracking-widest shadow-lg border-2 bg-red-50 border-red-200 text-red-700 dark:bg-red-900/20 dark:border-red-800 dark:text-red-400";
            }
            statusMsg.classList.remove('hidden');
            setTimeout(() => statusMsg.classList.add('hidden'), 5000);
        }
    </script>
</body>
</html>
