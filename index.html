    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<iframe src="home.html" id="main-frame" title="Poortjie Services Main Content"></iframe>
<script>
    const iframe = document.getElementById('main-frame');
    iframe.onload = function () {
        try {
            const iframeWindow = iframe.contentWindow;
            if (!iframeWindow) return;

            const isSameOrigin = (iframeWindow.location.origin === window.location.origin) ||
                               (iframeWindow.location.origin === 'null');

            if (isSameOrigin) {
                const iframeDoc = iframe.contentDocument || iframeWindow.document;
                if (iframeDoc && iframeDoc.title) {
                    document.title = iframeDoc.title;
                }
            }
        } catch (e) {
        }
    };
</script>
</body>
</html>
