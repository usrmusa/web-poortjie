<!DOCTYPE html>
<html lang="en">

          content="Poortjie, Marketplace, Buy and Sell, Kasi economy, local trade, South Africa, Township deals">

    <!-- Open Graph / Facebook -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://poortjie.services/market.html">
    <meta property="twitter:title" content="Poortjie Marketplace | Buy & Sell Local">
    <meta property="twitter:description" content="Find the best deals in Poortjie. Post your items for free and reach your local community.">
    <meta property="twitter:image" content="https://poortjie.services/favicon/web-app-manifest-512x512.png">

    <link rel="icon" type="image/png" sizes="48x48" href="favicon/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">

    <script src="https://cdn.tailwindcss.com"></script>

        if (window.console && window.console.log) {
            const originalLog = window.console.log;
            window.console.log = function() {
                if (arguments[0] && typeof arguments[0] === 'string' && (arguments[0].includes('cdn.tailwindcss.com should not be used in production') || arguments[0].includes('Tailwind CSS: You should not use the CDN'))) return;
                originalLog.apply(window.console, arguments);
            };
        }
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

<header class="max-w-6xl mx-auto pt-24 pb-8 px-6">

        <div>

            <p class="text-slate-500 dark:text-slate-400">Buy and sell in Poortjie</p>
        </div>
        <div class="w-full md:w-96">
            <div class="relative">
                <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none"

        <button class="category-pill whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-sm font-medium transition" data-category="Property">Property</button>
        <button class="category-pill whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-sm font-medium transition" data-category="Clothing">Clothing</button>
        <button class="category-pill whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-sm font-medium transition" data-category="Home">Home</button>
        <button class="category-pill whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-sm font-medium transition" data-category="Other">Other</button>
        <button class="category-pill whitespace-nowrap px-4 py-1.5 rounded-full bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-sm font-medium transition hidden" id="my-listings-pill" data-category="my-listings">My Listings</button>

<main class="max-w-6xl mx-auto px-6 pb-24">

            <div class="p-3 space-y-2">

                <div class="h-4 bg-gray-200 dark:bg-slate-700 rounded w-3/4"></div>

        </div>

</main>

<!-- Item Detail Modal -->

    <div class="bg-white dark:bg-slate-900 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl relative flex flex-col md:flex-row">
        <button onclick="closeItemModal()" class="absolute top-4 right-4 z-10 p-2 bg-white/80 dark:bg-slate-800/80 backdrop-blur rounded-full shadow-lg text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <div class="w-full md:w-1/2 bg-black flex items-center justify-center min-h-[300px] relative">

            <button id="modal-share-btn" class="absolute bottom-4 right-4 p-3 bg-white/20 hover:bg-white/40 backdrop-blur-md text-white rounded-full transition shadow-lg" title="Share Item">

            </button>
        </div>

        <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col">

                <button id="modal-call" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl text-center hover:bg-blue-700 transition flex items-center justify-center gap-2">

<!-- Login Alert Modal -->

            <i class="fas fa-user-lock"></i>
        </div>
        <h3 class="text-xl font-bold mb-2">Login Required</h3>

        <div class="flex gap-3">
            <button onclick="document.getElementById('login-alert-modal').classList.add('hidden')" class="flex-1 py-3 border border-gray-200 dark:border-slate-700 rounded-xl font-bold hover:bg-gray-50 dark:hover:bg-slate-700 transition">Cancel</button>
            <button onclick="window.location.href='authentication/login.html'" class="flex-1 py-3 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition shadow-lg">Login Now</button>

<script src="scripts/theme.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="scripts/firebase.js"></script>

<script>
    let allItems = [];
    let currentCategory = 'all';

    const itemsGrid = document.getElementById('items-grid');
    const noItems = document.getElementById('no-items');
    const searchInput = document.getElementById('market-search');
    const categoryPills = document.querySelectorAll('.category-pill');
    const myListingsPill = document.getElementById('my-listings-pill');

    function renderItems(items) {
        if (items.length === 0) {
            itemsGrid.innerHTML = '';
            noItems.classList.remove('hidden');
            return;
        }
        noItems.classList.add('hidden');

        itemsGrid.innerHTML = items.map(item => {
            let statusBadge = '';
            let opacity = 'opacity-100';

            if (item.status === 'out of stock') {
                statusBadge = '<div class="absolute top-2 right-2 bg-amber-500 text-white text-[10px] font-black px-2 py-0.5 rounded shadow-sm">OUT OF STOCK</div>';
            } else if (item.status === 'sold') {
                statusBadge = '<div class="absolute top-2 right-2 bg-purple-600 text-white text-[10px] font-black px-2 py-0.5 rounded shadow-sm">SOLD</div>';
                opacity = 'opacity-60';
            }

            return `
                <div class="item-card group bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer border border-gray-100 dark:border-slate-700 ${opacity}" onclick="openItemModal('${item.id}')">
                    <div class="relative aspect-square overflow-hidden">
                        <img src="${item.images && item.images[0] ? item.images[0] : 'https://via.placeholder.com/400?text=No+Image'}"
                             alt="${item.title}"
                             class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute top-2 left-2 bg-black/50 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded">
                            ${item.category}
                        </div>
                        ${statusBadge}
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-lg text-green-600 dark:text-green-400">R${item.price}</h3>
                        <h4 class="text-sm font-medium line-clamp-2 mb-1">${item.title}</h4>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400 flex items-center gap-1">
                            <i class="fas fa-map-marker-alt"></i> ${item.location || 'Poortjie'}
                        </p>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterItems() {
        const searchTerm = searchInput.value.toLowerCase();
        const currentUser = firebase.auth().currentUser;
        let filtered = allItems;

        // Security/Privacy Filter
        filtered = filtered.filter(item => {
            if (item.status === 'active' || item.status === 'out of stock') return true;
            if (item.status === 'sold' && currentUser && item.userId === currentUser.uid) return true;
            return false;
        });

        if (currentCategory === 'my-listings') {
            if (currentUser) {
                filtered = filtered.filter(item => item.userId === currentUser.uid);
            }
        } else if (currentCategory !== 'all') {
            filtered = filtered.filter(item => item.category === currentCategory);
        }

        if (searchTerm) {
            filtered = filtered.filter(item =>
                item.title.toLowerCase().includes(searchTerm) ||
                item.description.toLowerCase().includes(searchTerm) ||
                item.category.toLowerCase().includes(searchTerm)
            );
        }

        renderItems(filtered);
    }

    async function fetchItems() {
        db.collection('poortjie').doc('market').collection('items')
            .onSnapshot(snapshot => {
                allItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                allItems.sort((a, b) => {
                    const dateA = a.createdAt?.toDate() || new Date(0);
                    const dateB = b.createdAt?.toDate() || new Date(0);
                    return dateB - dateA;
                });

                // Check for direct link
                const urlParams = new URLSearchParams(window.location.search);
                const itemId = urlParams.get('id');
                if (itemId) {
                    const found = allItems.find(i => i.id === itemId);
                    if (found) openItemModal(itemId);
                }

                filterItems();
            }, error => {
                console.error("Error fetching market items:", error);
                itemsGrid.innerHTML = '<p class="col-span-full text-center py-10 opacity-50">Error loading items.</p>';
            });
    }

    const modal = document.getElementById('item-modal');
    const modalImg = document.getElementById('modal-image');
    const modalContent = document.getElementById('modal-content');
    const modalWhatsApp = document.getElementById('modal-whatsapp');
    const modalCall = document.getElementById('modal-call');
    const modalShare = document.getElementById('modal-share-btn');
    const publicActions = document.getElementById('public-actions');
    const ownerActions = document.getElementById('owner-actions');
    const deleteBtn = document.getElementById('delete-item-btn');
    const soldBtn = document.getElementById('toggle-sold-btn');
    const stockBtn = document.getElementById('toggle-stock-btn');

    window.openItemModal = (id) => {
        const item = allItems.find(i => i.id === id);
        if (!item) return;

        // Update URL for sharing without reload
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + id;
        window.history.pushState({path: newUrl}, '', newUrl);

        const currentUser = firebase.auth().currentUser;
        const isOwner = currentUser && item.userId === currentUser.uid;

        modalImg.src = item.images && item.images[0] ? item.images[0] : 'https://via.placeholder.com/400?text=No+Image';

        let statusTag = '';
        if (item.status === 'out of stock') statusTag = '<span class="ml-2 bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded">OUT OF STOCK</span>';
        if (item.status === 'sold') statusTag = '<span class="ml-2 bg-purple-600 text-white text-[10px] px-2 py-0.5 rounded">SOLD</span>';

        modalContent.innerHTML = `
            <div class="mb-4">
                <div class="flex items-center">
                    <span class="text-xs font-bold uppercase tracking-widest text-green-600 dark:text-green-400">${item.category}</span>
                    ${statusTag}
                </div>
                <h2 class="text-3xl font-black mt-1">${item.title}</h2>
                <h3 class="text-2xl font-bold text-green-600 dark:text-green-400 mt-2">R${item.price}</h3>
            </div>
            <div class="space-y-4">
                <div>
                    <h4 class="text-sm font-bold uppercase opacity-50 tracking-wider">Description</h4>
                    <p class="text-slate-700 dark:text-slate-300 leading-relaxed">${item.description || 'No description provided.'}</p>
                </div>
                <div class="flex items-center gap-4 py-4 border-y border-gray-100 dark:border-slate-800">
                    <div class="w-12 h-12 bg-gray-200 rounded-full overflow-hidden">
                        <img src="${item.sellerPhoto || 'https://via.placeholder.com/100'}" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <p class="text-xs opacity-50">Seller</p>
                        <p class="font-bold">${item.sellerName || 'Local Seller'}</p>
                    </div>
                </div>
                <p class="text-xs opacity-50 flex items-center gap-1">
                    <i class="fas fa-clock"></i> Posted ${item.createdAt ? formatRelativeTime(item.createdAt.toDate()) : 'recently'}
                </p>
            </div>
        `;

        modalShare.onclick = () => shareItem(item);

        if (isOwner) {
            publicActions.classList.add('hidden');
            ownerActions.classList.remove('hidden');

            soldBtn.innerHTML = item.status === 'sold' ? '<i class="fas fa-redo"></i> Relist Item' : '<i class="fas fa-check-circle"></i> Mark as Sold';
            soldBtn.onclick = () => updateItemStatus(id, item.status === 'sold' ? 'active' : 'sold');

            stockBtn.innerHTML = item.status === 'out of stock' ? '<i class="fas fa-box"></i> Back in Stock' : '<i class="fas fa-box-open"></i> Out of Stock';
            stockBtn.onclick = () => updateItemStatus(id, item.status === 'out of stock' ? 'active' : 'out of stock');

            deleteBtn.onclick = () => deleteItem(id);
        } else {
            publicActions.classList.remove('hidden');
            ownerActions.classList.add('hidden');

            const handleContact = (type) => {
                if (!currentUser) {
                    document.getElementById('login-alert-modal').classList.remove('hidden');
                    return;
                }
                const phone = item.sellerPhone || '';
                if (type === 'call') {
                    window.location.href = `tel:${phone}`;
                } else {
                    window.open(`https://wa.me/27${phone.substring(1)}?text=Hi, I am interested in your ${item.title} on Poortjie Marketplace.`, '_blank');
                }
            };

            modalCall.onclick = () => handleContact('call');
            modalWhatsApp.onclick = () => handleContact('whatsapp');

            if (item.status === 'sold') {
                publicActions.classList.add('opacity-50', 'pointer-events-none');
            } else {
                publicActions.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    };

    async function shareItem(item) {
        const shareData = {
            title: `Poortjie Marketplace: ${item.title}`,
            text: `Check out this ${item.title} for R${item.price} on Poortjie Marketplace!`,
            url: window.location.href
        };

        try {
            if (navigator.share) {
                await navigator.share(shareData);
            } else {
                await navigator.clipboard.writeText(window.location.href);
                alert("Link copied to clipboard!");
            }
        } catch (err) {
            console.error("Share failed", err);
        }
    }

    async function updateItemStatus(id, newStatus) {
        try {
            await db.collection('poortjie').doc('market').collection('items').doc(id).update({
                status: newStatus,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            closeItemModal();
        } catch (error) {
            alert("Failed to update status: " + error.message);
        }
    }

    async function deleteItem(id) {
        if (!confirm("Are you sure you want to delete this listing permanently?")) return;
        try {
            await db.collection('poortjie').doc('market').collection('items').doc(id).delete();
            closeItemModal();
        } catch (error) {
            alert("Failed to delete listing: " + error.message);
        }
    }

    window.closeItemModal = () => {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
        // Remove item ID from URL
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.pushState({path: newUrl}, '', newUrl);
    };

    function formatRelativeTime(date) {
        const now = new Date();
        const diffInSeconds = Math.floor((now - date) / 1000);
        if (diffInSeconds < 60) return 'just now';
        if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}m ago`;
        if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}h ago`;
        return `${Math.floor(diffInSeconds / 86400)}d ago`;
    }

    searchInput.addEventListener('input', filterItems);

    categoryPills.forEach(pill => {
        pill.addEventListener('click', () => {
            categoryPills.forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            currentCategory = pill.dataset.category;
            filterItems();
        });
    });

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const menuItems = document.getElementById('menu-items');
    hamburgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuItems.classList.toggle('hidden');
    });

    window.onclick = (e) => {
        if (e.target === modal) closeItemModal();
        if (menuItems && !menuItems.contains(e.target)) menuItems.classList.add('hidden');
    };

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            myListingsPill.classList.remove('hidden');
        } else {
            myListingsPill.classList.add('hidden');
            if (currentCategory === 'my-listings') {
                currentCategory = 'all';
                categoryPills[0].classList.add('active');
            }
        }
        filterItems();
    });

    fetchItems();
</script>
</body>
</html>
