<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Fleet | Poortjie</title>

    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#22c55e', secondary: '#16a34a' } } }
        }
    </script>
    <style>
        .seg-active { background: #16a34a; color: #fff; }
        .chip-active { background: #22c55e !important; color: #fff !important; border-color: #22c55e !important; }
        .card-selected { border-color: #22c55e !important; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp .3s ease-out both; }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased">

<!-- Header -->
<header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40">
    <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
        <button onclick="window.top.location.replace('../../index.html')"
                class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="flex items-center gap-2">
            <img src="./logo/tuktuk.png" alt="" class="w-6 h-6 object-contain">
            <span class="text-sm font-black uppercase tracking-widest">Poortjie Fleet</span>
        </div>
        <span class="bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400 px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-tighter">Preview</span>
    </div>
</header>

<main class="max-w-2xl mx-auto p-4 pb-28 space-y-6">

    <!-- Hero -->
    <section class="pt-4 text-center space-y-2">
        <h1 class="text-3xl sm:text-4xl font-black tracking-tight leading-tight">
            Recurring transport, <span class="text-green-600">sorted.</span>
        </h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm max-w-md mx-auto font-medium">
            Subscribe your learners or staff to a dependable weekly or monthly fleet — not once-off rides.
        </p>
    </section>

    <!-- Tabs -->
    <div class="grid grid-cols-3 gap-1 p-1 bg-slate-100 dark:bg-slate-800 rounded-2xl text-[11px] font-black uppercase tracking-widest">
        <button data-tab="browse" class="tab-btn py-3 rounded-xl transition">Browse</button>
        <button data-tab="build" class="tab-btn py-3 rounded-xl transition">Build a Plan</button>
        <button data-tab="plans" class="tab-btn py-3 rounded-xl transition">My Plans</button>
    </div>

    <!-- ============ BROWSE TAB ============ -->
    <section id="tab-browse" class="space-y-4">
        <div id="browse-filters" class="flex flex-wrap gap-2"></div>
        <div id="browse-list" class="space-y-4"></div>
    </section>

    <!-- ============ BUILD TAB ============ -->
    <section id="tab-build" class="space-y-6 hidden">

        <!-- Fleet type -->
        <div class="space-y-3">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">1. What kind of fleet?</label>
            <div id="fleet-type-grid" class="grid grid-cols-3 gap-3"></div>
        </div>

        <!-- Route -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">2. Route</label>
            <div class="space-y-3">
                <div class="relative">
                    <i class="fas fa-circle-dot absolute left-4 top-1/2 -translate-y-1/2 text-red-500 text-xs"></i>
                    <input type="text" id="f-pickup" placeholder="Pickup area (e.g. Zone 6, Kliptown)"
                           class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-green-500 outline-none transition font-bold text-sm">
                </div>
                <div class="relative">
                    <i class="fas fa-location-dot absolute left-4 top-1/2 -translate-y-1/2 text-green-500 text-xs"></i>
                    <input type="text" id="f-destination" placeholder="Drop-off (e.g. Riverside Primary)"
                           class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-green-500 outline-none transition font-bold text-sm">
                </div>
                <div class="relative">
                    <i class="fas fa-route absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="number" id="f-distance" min="1" step="1" placeholder="Distance one-way (km)"
                           class="w-full pl-11 pr-16 py-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-green-500 outline-none transition font-bold text-sm">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-black uppercase text-slate-400">km one-way</span>
                </div>
            </div>
        </div>

        <!-- Vehicle -->
        <div class="space-y-3">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">3. Vehicle</label>
            <div id="vehicle-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
        </div>

        <!-- Schedule -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 space-y-5">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">4. Schedule</label>
            <div id="days-chips" class="flex flex-wrap gap-2"></div>
            <button id="roundtrip-toggle" type="button"
                    class="flex items-center gap-3 w-full text-left p-3 rounded-2xl bg-slate-50 dark:bg-slate-900 transition">
                <span id="roundtrip-box" class="w-6 h-6 rounded-lg border-2 border-slate-300 dark:border-slate-600 flex items-center justify-center text-white text-xs"></span>
                <span class="text-sm font-bold">Return trip (there & back each day)</span>
            </button>
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Depart</span>
                    <input type="time" id="f-depart" class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-green-500 outline-none font-bold text-sm">
                </div>
                <div class="space-y-1">
                    <span class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Return</span>
                    <input type="time" id="f-return" class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-green-500 outline-none font-bold text-sm">
                </div>
            </div>
        </div>

        <!-- Riders / seats -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 space-y-5">
            <div class="flex items-center justify-between">
                <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">5. <span id="rider-noun-label">Riders</span> & seats</label>
                <div class="flex items-center gap-3">
                    <button id="seat-minus" type="button" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 font-black text-lg leading-none">−</button>
                    <span id="seat-count" class="w-6 text-center font-black text-lg">1</span>
                    <button id="seat-plus" type="button" class="w-9 h-9 rounded-full bg-green-600 text-white font-black text-lg leading-none">+</button>
                </div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="rider-name" placeholder="Add a rider's name (optional)"
                       class="flex-grow px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-green-500 outline-none font-bold text-sm">
                <button id="add-rider-btn" type="button" class="px-5 rounded-2xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 font-black text-sm">Add</button>
            </div>
            <div id="riders-list" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- Notes -->
        <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">Notes for the operator (optional)</label>
            <textarea id="f-notes" rows="2" placeholder="e.g. Youngest child is in Grade R, please assist with seatbelt."
                      class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-green-500 outline-none font-medium text-sm"></textarea>
        </div>
    </section>

    <!-- ============ PLANS TAB ============ -->
    <section id="tab-plans" class="space-y-4 hidden">
        <div id="confirmation-banner" class="hidden"></div>
        <div id="plans-list" class="space-y-4"></div>
    </section>

</main>

<!-- Sticky quote bar (only on Build tab) -->
<div id="quote-bar" class="hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-700">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-4">
        <div class="flex-shrink-0">
            <!-- Billing cycle toggle -->
            <div class="flex p-1 bg-slate-100 dark:bg-slate-900 rounded-xl text-[10px] font-black uppercase tracking-widest">
                <button data-cycle="weekly" class="cycle-btn px-3 py-1.5 rounded-lg transition">Weekly</button>
                <button data-cycle="monthly" class="cycle-btn px-3 py-1.5 rounded-lg transition">Monthly</button>
            </div>
        </div>
        <div class="flex-grow leading-tight">
            <div class="flex items-baseline gap-1">
                <span id="quote-price" class="text-2xl font-black text-green-600">R0</span>
                <span id="quote-per" class="text-[10px] font-black uppercase text-slate-400">/month</span>
            </div>
            <p id="quote-sub" class="text-[10px] font-bold text-slate-400 truncate">Fill in the plan to see your price</p>
        </div>
        <button id="subscribe-btn" class="flex-shrink-0 px-6 py-3.5 bg-green-600 hover:bg-green-700 disabled:opacity-40 text-white font-black uppercase tracking-widest text-xs rounded-2xl transition active:scale-95">
            Subscribe
        </button>
    </div>
</div>

<footer class="text-center py-10 border-t border-slate-100 dark:border-slate-800 opacity-50 text-xs">
    © 2026 Poortjie Services · Fleet subscriptions (preview with sample data)
</footer>

<!-- MVVM foundation + fleet Model/ViewModel -->
<script src="../../scripts/core/observable.js"></script>
<script src="../../scripts/models/fleet-model.js"></script>
<script src="../../scripts/viewmodels/fleet-view-model.js"></script>

<script>
    const M = window.FleetModel;
    const VM = window.FleetViewModel;
    const { actions } = VM;
    const zar = M.formatZar;

    // ---- static scaffolding built once from the Model -----------------------

    function buildFleetTypeGrid() {
        const grid = document.getElementById('fleet-type-grid');
        grid.innerHTML = Object.values(M.FLEET_TYPES).map(t => `
            <button data-fleettype="${t.id}" class="ftype-btn p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-center space-y-2 transition">
                <i class="fas ${t.icon} text-xl text-green-600"></i>
                <p class="text-[11px] font-black leading-tight">${t.label}</p>
            </button>
        `).join('');
    }

    function buildVehicleGrid() {
        const grid = document.getElementById('vehicle-grid');
        grid.innerHTML = Object.values(M.VEHICLE_CLASSES).map(v => `
            <button data-vehicle="${v.id}" class="veh-btn p-3 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-center space-y-1 transition">
                <i class="fas ${v.icon} text-lg text-green-600"></i>
                <p class="text-[10px] font-black leading-tight">${v.label}</p>
                <p class="text-[9px] font-bold text-slate-400">${v.capacity} seats</p>
            </button>
        `).join('');
    }

    function buildDaysChips() {
        const wrap = document.getElementById('days-chips');
        wrap.innerHTML = M.WEEK_DAYS.map(d => `
            <button data-day="${d.id}" class="day-chip w-11 h-11 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[11px] font-black uppercase transition">
                ${d.short}
            </button>
        `).join('');
    }

    function buildBrowseFilters() {
        const wrap = document.getElementById('browse-filters');
        const options = [{ id: 'all', label: 'All fleets', icon: 'fa-layer-group' }]
            .concat(Object.values(M.FLEET_TYPES).map(t => ({ id: t.id, label: t.label, icon: t.icon })));
        wrap.innerHTML = options.map(o => `
            <button data-filter="${o.id}" class="filter-btn px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[10px] font-black uppercase tracking-widest transition">
                <i class="fas ${o.icon} mr-1"></i>${o.label}
            </button>
        `).join('');
    }

    function daysLabel(days) {
        const set = new Set(days);
        const weekdays = ['mon','tue','wed','thu','fri'];
        if (weekdays.every(d => set.has(d)) && days.length === 5) return 'Mon–Fri';
        if (days.length === 7) return 'Every day';
        return M.WEEK_DAYS.filter(d => set.has(d.id)).map(d => d.short).join(', ');
    }

    // ---- reactive rendering -------------------------------------------------

    function renderTabs(state) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('seg-active', btn.dataset.tab === state.tab);
        });
        document.getElementById('tab-browse').classList.toggle('hidden', state.tab !== 'browse');
        document.getElementById('tab-build').classList.toggle('hidden', state.tab !== 'build');
        document.getElementById('tab-plans').classList.toggle('hidden', state.tab !== 'plans');
        document.getElementById('quote-bar').classList.toggle('hidden', state.tab !== 'build');
    }

    function renderBrowse(state) {
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.toggle('chip-active', b.dataset.filter === state.filterType);
        });
        const list = document.getElementById('browse-list');
        const fleets = state.availableFleets.filter(f =>
            state.filterType === 'all' || f.fleetType === state.filterType);

        if (!fleets.length) {
            list.innerHTML = `<div class="text-center py-16 opacity-30"><i class="fas fa-magnifying-glass text-3xl mb-3 block"></i><p class="font-black uppercase tracking-widest text-xs">No fleets in this category</p></div>`;
            return;
        }
        list.innerHTML = fleets.map(f => {
            const type = M.FLEET_TYPES[f.fleetType];
            const veh = M.VEHICLE_CLASSES[f.vehicleClass];
            return `
            <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-5 space-y-4 fade-up">
                <div class="flex justify-between items-start gap-3">
                    <div class="flex items-start gap-3">
                        <div class="w-11 h-11 rounded-2xl bg-green-100 dark:bg-green-900/30 flex items-center justify-center text-green-600 flex-shrink-0">
                            <i class="fas ${type.icon}"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-black text-sm leading-tight">${f.name}</h3>
                                ${f.verified ? '<i class="fas fa-circle-check text-green-500 text-xs" title="Verified operator"></i>' : ''}
                            </div>
                            <p class="text-[11px] text-slate-400 font-bold">${f.operator}</p>
                        </div>
                    </div>
                    ${f.badge ? `<span class="text-[8px] font-black uppercase tracking-widest bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-2 py-1 rounded-full whitespace-nowrap">${f.badge}</span>` : ''}
                </div>

                <div class="flex items-center gap-2 text-xs font-bold">
                    <i class="fas fa-circle-dot text-red-500 text-[8px]"></i>
                    <span class="truncate">${f.pickupArea}</span>
                    <i class="fas fa-arrow-right-long text-slate-300 mx-1"></i>
                    <i class="fas fa-location-dot text-green-500 text-[10px]"></i>
                    <span class="truncate">${f.destination}</span>
                </div>

                <div class="flex flex-wrap gap-x-4 gap-y-1 text-[10px] font-black uppercase tracking-wider text-slate-400">
                    <span><i class="fas ${veh.icon} mr-1"></i>${veh.label}</span>
                    <span><i class="fas fa-calendar-week mr-1"></i>${daysLabel(f.days)}</span>
                    <span><i class="fas fa-clock mr-1"></i>${f.departTime}</span>
                    <span><i class="fas fa-star text-amber-400 mr-1"></i>${f.rating}</span>
                    <span class="${f.seatsAvailable <= 3 ? 'text-amber-500' : ''}"><i class="fas fa-chair mr-1"></i>${f.seatsAvailable} seats left</span>
                </div>

                <div class="flex items-center justify-between pt-1 border-t border-slate-100 dark:border-slate-700">
                    <div class="leading-tight">
                        <span class="text-xl font-black text-green-600">${zar(f.monthlyPrice)}</span>
                        <span class="text-[10px] font-black uppercase text-slate-400">/month · per seat</span>
                    </div>
                    <button data-usefleet="${f.id}" class="px-5 py-2.5 bg-green-600 hover:bg-green-700 text-white font-black uppercase tracking-widest text-[10px] rounded-xl transition active:scale-95">
                        Use this plan
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function renderBuild(state) {
        const f = state.form;
        const q = state.quote;

        // selection highlights
        document.querySelectorAll('.ftype-btn').forEach(b =>
            b.classList.toggle('card-selected', b.dataset.fleettype === f.fleetType));
        document.querySelectorAll('.veh-btn').forEach(b =>
            b.classList.toggle('card-selected', b.dataset.vehicle === f.vehicleClass));
        document.querySelectorAll('.day-chip').forEach(b =>
            b.classList.toggle('chip-active', f.days.includes(b.dataset.day)));
        document.querySelectorAll('.cycle-btn').forEach(b =>
            b.classList.toggle('seg-active', b.dataset.cycle === f.billingCycle));

        // round trip box
        const box = document.getElementById('roundtrip-box');
        box.classList.toggle('bg-green-600', f.roundTrip);
        box.classList.toggle('border-green-600', f.roundTrip);
        box.innerHTML = f.roundTrip ? '<i class="fas fa-check"></i>' : '';

        // rider noun + seats + riders list
        const noun = M.FLEET_TYPES[f.fleetType] ? M.FLEET_TYPES[f.fleetType].riderNoun : 'Rider';
        document.getElementById('rider-noun-label').textContent = noun + 's';
        document.getElementById('seat-count').textContent = f.seats;
        document.getElementById('rider-name').placeholder = `Add a ${noun.toLowerCase()}'s name (optional)`;
        document.getElementById('riders-list').innerHTML = f.riders.map((r, i) => `
            <span class="inline-flex items-center gap-2 pl-3 pr-2 py-1.5 rounded-full bg-slate-100 dark:bg-slate-700 text-xs font-bold">
                ${r}
                <button data-removerider="${i}" class="w-5 h-5 rounded-full bg-slate-300 dark:bg-slate-600 text-white flex items-center justify-center text-[10px]">✕</button>
            </span>`).join('');

        // text inputs — only write when not being edited (prevents cursor jump)
        setInputIfBlurred('f-pickup', f.pickup);
        setInputIfBlurred('f-destination', f.destination);
        setInputIfBlurred('f-distance', f.distanceKm);
        setInputIfBlurred('f-depart', f.departTime);
        setInputIfBlurred('f-return', f.returnTime);
        setInputIfBlurred('f-notes', f.notes);

        // quote bar
        const cycle = f.billingCycle;
        const price = M.priceForCycle(q, cycle);
        document.getElementById('quote-price').textContent = zar(price);
        document.getElementById('quote-per').textContent = cycle === 'weekly' ? '/week' : '/month';
        const subEl = document.getElementById('quote-sub');
        if (q.valid) {
            const savingTxt = cycle === 'monthly' && q.monthlySaving > 0 ? ` · save ${zar(q.monthlySaving)} vs weekly` : '';
            subEl.textContent = `${q.tripsPerWeek} trips/week · ${f.seats} seat(s) · ${zar(q.weekly)}/wk${savingTxt}`;
        } else {
            subEl.textContent = 'Add distance, seats and travel days to price it';
        }
        document.getElementById('subscribe-btn').disabled = !q.valid;
    }

    function renderPlans(state) {
        // confirmation banner
        const banner = document.getElementById('confirmation-banner');
        if (state.lastConfirmation) {
            const c = state.lastConfirmation;
            banner.className = 'bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-3xl p-5 flex items-start gap-4 fade-up';
            banner.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center flex-shrink-0"><i class="fas fa-check"></i></div>
                <div class="flex-grow">
                    <p class="font-black text-sm text-green-800 dark:text-green-300">Subscription requested!</p>
                    <p class="text-xs text-green-600 dark:text-green-400 mt-0.5">${zar(c.amount)} ${c.cycle} · pending operator confirmation.</p>
                </div>
                <button id="dismiss-confirm" class="text-green-600 hover:text-green-800"><i class="fas fa-xmark"></i></button>`;
        } else {
            banner.className = 'hidden';
            banner.innerHTML = '';
        }

        const list = document.getElementById('plans-list');
        if (!state.mySubscriptions.length) {
            list.innerHTML = `<div class="text-center py-16 opacity-30"><i class="fas fa-inbox text-3xl mb-3 block"></i><p class="font-black uppercase tracking-widest text-xs">No subscriptions yet</p></div>`;
            return;
        }
        const statusMeta = {
            active: { label: 'Active', cls: 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400' },
            pending: { label: 'Pending', cls: 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400' },
            paused: { label: 'Paused', cls: 'bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300' },
            cancelled: { label: 'Cancelled', cls: 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400' }
        };
        list.innerHTML = state.mySubscriptions.map(s => {
            const type = M.FLEET_TYPES[s.fleetType] || M.FLEET_TYPES.group;
            const veh = M.VEHICLE_CLASSES[s.vehicleClass] || {};
            const st = statusMeta[s.status] || statusMeta.pending;
            const per = s.billingCycle === 'weekly' ? '/wk' : '/mo';
            const canPause = s.status === 'active';
            const canResume = s.status === 'paused';
            const canCancel = s.status !== 'cancelled';
            return `
            <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-5 space-y-4 fade-up">
                <div class="flex justify-between items-start">
                    <div class="flex items-start gap-3">
                        <div class="w-11 h-11 rounded-2xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-green-600 flex-shrink-0"><i class="fas ${type.icon}"></i></div>
                        <div>
                            <h3 class="font-black text-sm leading-tight">${s.fleetName}</h3>
                            <p class="text-[11px] text-slate-400 font-bold">${type.label} · ${veh.label || ''}</p>
                        </div>
                    </div>
                    <span class="text-[9px] font-black uppercase tracking-widest px-2.5 py-1 rounded-full ${st.cls}">${st.label}</span>
                </div>

                <div class="flex items-center gap-2 text-xs font-bold">
                    <i class="fas fa-circle-dot text-red-500 text-[8px]"></i><span class="truncate">${s.pickup}</span>
                    <i class="fas fa-arrow-right-long text-slate-300"></i>
                    <i class="fas fa-location-dot text-green-500 text-[10px]"></i><span class="truncate">${s.destination}</span>
                </div>

                <div class="flex flex-wrap gap-x-4 gap-y-1 text-[10px] font-black uppercase tracking-wider text-slate-400">
                    <span><i class="fas fa-calendar-week mr-1"></i>${daysLabel(s.days)}</span>
                    <span><i class="fas fa-clock mr-1"></i>${s.departTime}–${s.returnTime}</span>
                    <span><i class="fas fa-users mr-1"></i>${s.riders.join(', ')}</span>
                    <span><i class="fas fa-calendar-check mr-1"></i>Next: ${s.nextBillingDate}</span>
                </div>

                <div class="flex items-center justify-between pt-1 border-t border-slate-100 dark:border-slate-700">
                    <div class="leading-tight">
                        <span class="text-xl font-black text-green-600">${zar(s.amount)}</span>
                        <span class="text-[10px] font-black uppercase text-slate-400">${per}</span>
                    </div>
                    <div class="flex gap-2">
                        ${canPause ? `<button data-setstatus="${s.id}:paused" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-700 text-[10px] font-black uppercase tracking-widest">Pause</button>` : ''}
                        ${canResume ? `<button data-setstatus="${s.id}:active" class="px-4 py-2 rounded-xl bg-green-600 text-white text-[10px] font-black uppercase tracking-widest">Resume</button>` : ''}
                        ${canCancel ? `<button data-setstatus="${s.id}:cancelled" class="px-4 py-2 rounded-xl bg-red-50 dark:bg-red-900/20 text-red-600 text-[10px] font-black uppercase tracking-widest">Cancel</button>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function setInputIfBlurred(id, value) {
        const el = document.getElementById(id);
        if (el && document.activeElement !== el && String(el.value) !== String(value ?? '')) {
            el.value = value ?? '';
        }
    }

    function render(state) {
        renderTabs(state);
        renderBrowse(state);
        renderBuild(state);
        renderPlans(state);
    }

    // ---- event wiring (delegation) ------------------------------------------

    function wireEvents() {
        // Tabs
        document.querySelectorAll('.tab-btn').forEach(b =>
            b.addEventListener('click', () => actions.setTab(b.dataset.tab)));

        // Delegated clicks for dynamic + static buttons
        document.body.addEventListener('click', (e) => {
            const t = e.target.closest('[data-usefleet],[data-filter],[data-fleettype],[data-vehicle],[data-day],[data-cycle],[data-removerider],[data-setstatus],#dismiss-confirm');
            if (!t) return;
            if (t.dataset.usefleet) actions.prefillFromFleet(t.dataset.usefleet);
            else if (t.dataset.filter) actions.setFilterType(t.dataset.filter);
            else if (t.dataset.fleettype) actions.setFleetType(t.dataset.fleettype);
            else if (t.dataset.vehicle) actions.setVehicleClass(t.dataset.vehicle);
            else if (t.dataset.day) actions.toggleDay(t.dataset.day);
            else if (t.dataset.cycle) actions.setBillingCycle(t.dataset.cycle);
            else if (t.dataset.removerider) actions.removeRider(Number(t.dataset.removerider));
            else if (t.dataset.setstatus) {
                const [id, status] = t.dataset.setstatus.split(':');
                if (status === 'cancelled' && !confirm('Cancel this subscription?')) return;
                actions.updateSubscriptionStatus(id, status);
            } else if (t.id === 'dismiss-confirm') actions.clearConfirmation();
        });

        // Round trip + seats
        document.getElementById('roundtrip-toggle').addEventListener('click', () => actions.toggleRoundTrip());
        document.getElementById('seat-minus').addEventListener('click', () => actions.setSeats(VM.getState().form.seats - 1));
        document.getElementById('seat-plus').addEventListener('click', () => actions.setSeats(VM.getState().form.seats + 1));

        // Add rider
        const addRider = () => {
            const input = document.getElementById('rider-name');
            actions.addRider(input.value);
            input.value = '';
            input.focus();
        };
        document.getElementById('add-rider-btn').addEventListener('click', addRider);
        document.getElementById('rider-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addRider(); } });

        // Text/number/time inputs -> form fields
        const bind = (id, field, parse) => {
            document.getElementById(id).addEventListener('input', (e) => {
                actions.setField(field, parse ? parse(e.target.value) : e.target.value);
            });
        };
        bind('f-pickup', 'pickup');
        bind('f-destination', 'destination');
        bind('f-distance', 'distanceKm', v => Number(v) || 0);
        bind('f-depart', 'departTime');
        bind('f-return', 'returnTime');
        bind('f-notes', 'notes');

        // Subscribe
        document.getElementById('subscribe-btn').addEventListener('click', () => {
            const res = actions.submitSubscription();
            if (!res.ok) alert(res.error);
        });
    }

    // ---- boot ---------------------------------------------------------------
    buildFleetTypeGrid();
    buildVehicleGrid();
    buildDaysChips();
    buildBrowseFilters();
    wireEvents();
    VM.subscribe(render); // renders immediately + on every state change
</script>

</body>
</html>
