<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Suggestions - Poortjie Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 10px; }
        .pac-container { z-index: 9999 !important; border-radius: 1rem; border: none; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); margin-top: 5px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased">

<div id="loader-overlay" class="fixed inset-0 bg-white dark:bg-slate-900 z-50 flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="animate-spin h-10 w-10 border-4 border-green-500 border-t-transparent rounded-full mb-4"></div>
    <p class="text-xs font-black uppercase tracking-widest animate-pulse">Loading Panel...</p>
</div>

<header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center">
        <button onclick="window.history.back()" class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="flex-grow text-center">
            <h1 class="text-sm font-black uppercase tracking-widest">Manage Suggestions</h1>
        </div>
        <div id="user-avatar" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold overflow-hidden border border-slate-200 dark:border-slate-700">
            <span id="user-initial">?</span>
        </div>
    </div>
</header>

<main class="max-w-xl mx-auto p-4 space-y-6 pb-24">
    <!-- Search and Map Section -->
    <div class="bg-white dark:bg-slate-800 rounded-[2rem] shadow-xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
        <h2 class="text-xl font-black">Add New Place</h2>
        <div class="space-y-4">
            <div class="form-group">
                <label for="place-search" class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Search Place</label>
                <div class="relative">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="place-search" placeholder="Search for a place..."
                           class="w-full pl-12 pr-5 py-4 rounded-2xl border-2 border-transparent bg-slate-50 dark:bg-slate-900 focus:border-green-500 outline-none transition font-bold text-sm">
                </div>
            </div>
            <div id="map" class="w-full h-64 rounded-2xl border-2 border-slate-100 dark:border-slate-800"></div>
            <button id="add-place-btn" disabled class="w-full py-4 bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-black uppercase tracking-widest text-xs rounded-2xl transition-all transform active:scale-95">
                Add to Suggestions
            </button>
        </div>
    </div>

    <!-- Suggestions List Section -->
    <div class="space-y-4">
        <div class="flex items-center justify-between px-2">
            <h2 class="text-lg font-black uppercase tracking-tight">Active Suggestions</h2>
            <div class="flex items-center gap-3">
                <i class="fas fa-sort text-slate-400 text-[10px]"></i>
                <select id="sort-select" onchange="changeSort()" class="bg-transparent text-[9px] font-black uppercase tracking-widest text-slate-500 outline-none cursor-pointer">
                    <option value="order">Custom Order</option>
                    <option value="name">Alphabetical</option>
                </select>
            </div>
        </div>
        <div id="suggestions-list" class="space-y-3">
            <!-- Suggestions will be loaded here -->
            <div class="text-center py-12 opacity-30 italic text-sm">Loading suggestions...</div>
        </div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../../scripts/firebase.js"></script>

<script>
    let map, marker, selectedPlace = null;
    let suggestions = [];
    let currentUserId = null;
    let currentSort = "order";
    let unsubscribeSuggestions = null;

    const PATHS = {
        ROOT_COLLECTION: "kasilayn",
        ROOT_DOCUMENT: "poortjieOperator",
        SUGGESTIONS: "suggested_places"
    };

    const getSuggestionsRef = () => db.collection(PATHS.ROOT_COLLECTION)
                                      .doc(PATHS.ROOT_DOCUMENT)
                                      .collection(PATHS.SUGGESTIONS);

    firebase.auth().onAuthStateChanged(async user => {
        if (!user) {
            window.location.href = '../../authentication/login.html';
            return;
        }

        currentUserId = user.uid;

        try {
            const userDoc = await db.collection('users').doc(user.uid).get();
            const userData = userDoc.data();
            const isSuperUser = userData?.roles?.digilayn?.is_super_user || false;
            const isOwner = userData?.roles?.tuktuk?.is_owner || false;

            if (!(isSuperUser || isOwner)) {
                alert("Unauthorized access.");
                window.location.href = 'request.html';
                return;
            }

            const name = userData?.display_name || user.displayName || user.email.split('@')[0];
            document.getElementById('user-initial').textContent = name.charAt(0).toUpperCase();
            if (userData?.photo_url) {
                document.getElementById('user-avatar').innerHTML = `<img src="${userData?.photo_url}" class="w-full h-full object-cover">`;
            }
        } catch (e) {
            console.error(e);
        }

        loadSuggestions();
        const loader = document.getElementById('loader-overlay');
        if (loader) {
            loader.classList.add('opacity-0');
            setTimeout(() => loader.remove(), 300);
        }
    });

    function initMap() {
        const poortjieCenter = {lat: -26.456323807221267, lng: 27.77044633885547};
        map = new google.maps.Map(document.getElementById("map"), {
            center: poortjieCenter,
            zoom: 14,
            disableDefaultUI: true,
            styles: [{"featureType": "poi", "stylers": [{"visibility": "off"}]}]
        });

        marker = new google.maps.Marker({
            map: map,
            draggable: false,
            visible: false,
            icon: { url: "https://maps.google.com/mapfiles/ms/icons/green-dot.png" }
        });

        const autocomplete = new google.maps.places.Autocomplete(document.getElementById('place-search'), {
            componentRestrictions: {country: "za"},
            fields: ["name", "formatted_address", "geometry"]
        });

        autocomplete.addListener("place_changed", () => {
            const place = autocomplete.getPlace();
            if (!place.geometry || !place.geometry.location) return;

            selectedPlace = {
                name: place.name,
                address: place.formatted_address,
                latitude: place.geometry.location.lat(),
                longitude: place.geometry.location.lng()
            };

            marker.setPosition(place.geometry.location);
            marker.setVisible(true);
            map.setCenter(place.geometry.location);
            map.setZoom(16);
            document.getElementById('add-place-btn').disabled = false;
        });
    }

    function changeSort() {
        currentSort = document.getElementById('sort-select').value;
        loadSuggestions();
    }

    async function loadSuggestions() {
        if (unsubscribeSuggestions) unsubscribeSuggestions();

        let query = getSuggestionsRef();
        if (currentSort === 'name') {
            query = query.orderBy('name', 'asc');
        } else {
            query = query.orderBy('order', 'asc');
        }

        unsubscribeSuggestions = query.onSnapshot(snapshot => {
            suggestions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderSuggestions();
        }, error => {
            console.error("Error loading suggestions:", error);
        });
    }

    function renderSuggestions() {
        const list = document.getElementById('suggestions-list');
        if (suggestions.length === 0) {
            list.innerHTML = `<div class="text-center py-12 opacity-30 italic text-sm">No suggestions added yet.</div>`;
            return;
        }

        list.innerHTML = '';
        suggestions.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = "p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 flex items-center justify-between shadow-sm";

            const showReorder = currentSort === 'order';

            div.innerHTML = `
                <div class="flex items-center gap-3">
                    ${showReorder ? `
                    <div class="flex flex-col gap-1">
                        <button onclick="moveUp('${item.id}', ${index})" class="text-slate-400 hover:text-green-500 transition ${index === 0 ? 'opacity-0 pointer-events-none' : ''}">
                            <i class="fas fa-chevron-up text-[10px]"></i>
                        </button>
                        <button onclick="moveDown('${item.id}', ${index})" class="text-slate-400 hover:text-green-500 transition ${index === suggestions.length - 1 ? 'opacity-0 pointer-events-none' : ''}">
                            <i class="fas fa-chevron-down text-[10px]"></i>
                        </button>
                    </div>` : ''}
                    <div>
                        <h4 class="font-black text-sm uppercase tracking-tight">${item.name}</h4>
                        <p class="text-[10px] font-bold opacity-40 truncate max-w-[200px]">${item.address}</p>
                    </div>
                </div>
                <button onclick="deleteSuggestion('${item.id}')" class="w-8 h-8 rounded-full bg-red-50 dark:bg-red-900/20 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition">
                    <i class="fas fa-trash text-xs"></i>
                </button>
            `;
            list.appendChild(div);
        });
    }

    document.getElementById('add-place-btn').onclick = async () => {
        if (!selectedPlace) return;
        const btn = document.getElementById('add-place-btn');
        btn.disabled = true;
        btn.textContent = "Adding...";

        try {
            const newDocRef = getSuggestionsRef().doc();
            await newDocRef.set({
                id: newDocRef.id,
                ...selectedPlace,
                order: suggestions.length
            });
            document.getElementById('place-search').value = '';
            marker.setVisible(false);
            selectedPlace = null;
            btn.textContent = "Add to Suggestions";
        } catch (e) {
            alert("Error: " + e.message);
            btn.disabled = false;
        }
    };

    async function deleteSuggestion(id) {
        if (!confirm("Remove this place from suggestions?")) return;
        try {
            await getSuggestionsRef().doc(id).delete();
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    async function moveUp(id, index) {
        if (index === 0) return;
        const prevItem = suggestions[index - 1];
        const batch = db.batch();
        batch.update(getSuggestionsRef().doc(id), { order: index - 1 });
        batch.update(getSuggestionsRef().doc(prevItem.id), { order: index });
        await batch.commit();
    }

    async function moveDown(id, index) {
        if (index === suggestions.length - 1) return;
        const nextItem = suggestions[index + 1];
        const batch = db.batch();
        batch.update(getSuggestionsRef().doc(id), { order: index + 1 });
        batch.update(getSuggestionsRef().doc(nextItem.id), { order: index });
        await batch.commit();
    }
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyANCpYHeLyWkgVtWL06xpI7XsP08xu9GPA&libraries=places&callback=initMap"></script>
</body>
</html>
