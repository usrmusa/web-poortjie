<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Listing | Poortjie</title>
    <meta name="author" content="Musa Mgijima">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.console && window.console.log) {
            const originalLog = window.console.log;
            window.console.log = function() {
                if (arguments[0] && typeof arguments[0] === 'string' && (arguments[0].includes('cdn.tailwindcss.com should not be used in production') || arguments[0].includes('Tailwind CSS: You should not use the CDN'))) return;
                originalLog.apply(window.console, arguments);
            };
        }
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="icon" type="image/png" sizes="48x48" href="../favicon/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="../favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
    <link rel="manifest" href="../favicon/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="../scripts/loader.js"></script>
</head>
<body class="font-sans antialiased bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100">

<header class="max-w-6xl mx-auto pt-20 pb-12 px-6 text-center">
    <a href="../market.html" class="text-4xl font-extrabold tracking-tight">Marketplace</a>
    <h1 id="page-title" class="text-xl mt-2 opacity-70">List an item for sale</h1>
</header>

<main class="max-w-2xl mx-auto px-6 pb-24">
    <div class="card p-8 rounded-2xl border-l-4 border-l-green-500 bg-white dark:bg-slate-800 shadow-sm">
        <form id="market-form" novalidate class="space-y-6">
            <div class="form-group">
                <label for="item-title" class="block mb-1 font-bold text-sm uppercase tracking-wider">What are you selling?</label>
                <input type="text" id="item-title" name="title" required maxlength="50" placeholder="e.g. iPhone 12 Pro"
                       class="w-full p-3 rounded-lg bg-gray-100 dark:bg-slate-700 border-2 border-transparent focus:border-green-500 focus:outline-none transition text-gray-900 dark:text-white">
                <p id="title-error" class="text-red-500 text-[10px] font-bold mt-1 hidden">Item title is required</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                    <label for="item-price" class="block mb-1 font-bold text-sm uppercase tracking-wider">Price (R)</label>
                    <input type="number" id="item-price" name="price" required placeholder="0"
                           class="w-full p-3 rounded-lg bg-gray-100 dark:bg-slate-700 border-2 border-transparent focus:border-green-500 focus:outline-none transition text-gray-900 dark:text-white">
                    <p id="price-error" class="text-red-500 text-[10px] font-bold mt-1 hidden">Please enter a valid price</p>
                </div>
                <div class="form-group">
                    <label for="item-category" class="block mb-1 font-bold text-sm uppercase tracking-wider">Category</label>
                    <select id="item-category" name="category" required
                            class="w-full p-3 rounded-lg bg-gray-100 dark:bg-slate-700 border-2 border-transparent focus:border-green-500 focus:outline-none transition text-gray-900 dark:text-white">
                        <option value="" disabled selected>Select a category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Vehicles">Vehicles</option>
                        <option value="Property">Property</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Home">Home</option>
                        <option value="Other">Other</option>
                    </select>
                    <p id="category-error" class="text-red-500 text-[10px] font-bold mt-1 hidden">Please select a category</p>
                </div>
            </div>

            <div class="form-group">
                <label for="item-description" class="block mb-1 font-bold text-sm uppercase tracking-wider">Description</label>
                <div class="relative">
                    <textarea id="item-description" name="description" rows="4" required maxlength="500" placeholder="Describe the condition, features, etc."
                              class="w-full p-3 rounded-lg bg-gray-100 dark:bg-slate-700 border-2 border-transparent focus:border-green-500 focus:outline-none transition text-gray-900 dark:text-white"></textarea>
                    <div id="description-counter" class="absolute right-2 bottom-2 text-[10px] opacity-40 font-mono">
                        0/500
                    </div>
                </div>
                <p id="description-error" class="text-red-500 text-[10px] font-bold mt-1 hidden">Please provide a description</p>
            </div>

            <div class="form-group">
                <label class="block mb-1 font-bold text-sm uppercase tracking-wider">Photos (max 5)</label>
                <div id="photo-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                    <!-- Photo slots will be rendered here -->
                </div>
                <p id="photos-error" class="text-red-500 text-[10px] font-bold mt-1 hidden">At least one photo is required</p>
                <p class="text-[10px] mt-2 opacity-50 italic">Photos will be cropped to 1:1 square automatically.</p>
                <input type="hidden" id="item-photos" name="photos">
            </div>

            <div class="form-group">
                <label for="item-location" class="block mb-1 font-bold text-sm uppercase tracking-wider">Location</label>
                <input type="text" id="item-location" name="location" value="Poortjie"
                       class="w-full p-3 rounded-lg bg-gray-100 dark:bg-slate-700 border-2 border-transparent focus:border-green-500 focus:outline-none transition text-gray-900 dark:text-white">
                <p id="location-error" class="text-red-500 text-[10px] font-bold mt-1 hidden">Location is required</p>
            </div>

            <div class="pt-4">
                <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fas fa-plus-circle"></i> <span id="submit-btn-text">Post Item</span>
                </button>
            </div>
        </form>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../scripts/firebase.js"></script>

<script>
    let uploadedPhotos = [];
    let editingId = new URLSearchParams(window.location.search).get('id');
    const photoGrid = document.getElementById('photo-grid');
    const form = document.getElementById('market-form');
    const submitBtn = document.getElementById('submit-btn');
    const submitBtnText = document.getElementById('submit-btn-text');
    const pageTitle = document.getElementById('page-title');
    const descInput = document.getElementById('item-description');
    const descCounter = document.getElementById('description-counter');

    function safeHideLoader() {
        if (typeof hideLoader === 'function') {
            hideLoader();
        } else {
            const loader = document.getElementById('global-loader');
            if (loader) loader.style.display = 'none';
        }
    }

    function renderPhotoSlots() {
        photoGrid.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const slot = document.createElement('div');
            slot.className = 'aspect-square rounded-lg border-2 border-dashed border-gray-200 dark:border-slate-700 overflow-hidden relative flex items-center justify-center bg-gray-50 dark:bg-slate-800';

            if (uploadedPhotos[i]) {
                slot.innerHTML = `
                    <img src="${uploadedPhotos[i]}" class="w-full h-full object-cover">
                    <button type="button" onclick="removePhoto(${i})" class="absolute top-1 right-1 bg-red-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shadow-lg">
                        <i class="fas fa-times"></i>
                    </button>
                `;
            } else {
                slot.innerHTML = `
                    <label class="cursor-pointer w-full h-full flex flex-col items-center justify-center hover:bg-gray-100 dark:hover:bg-slate-700 transition">
                        <i class="fas fa-camera text-gray-400 text-xl"></i>
                        <input type="file" class="hidden" accept="image/*" onchange="handlePhotoUpload(event, ${i})">
                    </label>
                `;
            }
            photoGrid.appendChild(slot);
        }
    }

    async function canvasToJpegBlobUnder1MB(canvas) {
        const MAX_BYTES = 1024 * 1024; // 1MB
        let quality = 0.9;

        for (let i = 0; i < 9; i++) {
            const blob = await new Promise((resolve) =>
                canvas.toBlob(resolve, "image/jpeg", quality)
            );
            if (blob && blob.size <= MAX_BYTES) return blob;
            quality -= 0.1;
            if (quality < 0.1) break;
        }

        let w = canvas.width;
        let h = canvas.height;

        for (let j = 0; j < 6; j++) {
            w = Math.floor(w * 0.85);
            h = Math.floor(h * 0.85);

            const smaller = document.createElement("canvas");
            smaller.width = w;
            smaller.height = h;
            const ctx = smaller.getContext("2d");
            ctx.drawImage(canvas, 0, 0, w, h);

            quality = 0.8;
            for (let i = 0; i < 8; i++) {
                const blob = await new Promise((resolve) =>
                    smaller.toBlob(resolve, "image/jpeg", quality)
                );
                if (blob && blob.size <= MAX_BYTES) return blob;
                quality -= 0.1;
                if (quality < 0.1) break;
            }
        }

        return await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.6));
    }

    async function handlePhotoUpload(event, index) {
        const file = event.target.files[0];
        if (!file) return;

        const slot = photoGrid.children[index];
        slot.innerHTML = `
            <div class="flex flex-col items-center gap-1">
                <div class="animate-spin h-5 w-5 border-2 border-green-500 border-t-transparent rounded-full"></div>
                <span class="text-[8px] font-bold opacity-50 uppercase text-center">Processing</span>
            </div>
        `;

        try {
            const user = firebase.auth().currentUser;
            if (!user) throw new Error("Please log in first.");

            const processedBlob = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        let size = Math.min(img.width, img.height);
                        let xOffset = (img.width - size) / 2;
                        let yOffset = (img.height - size) / 2;

                        const MAX_DIM = 1200;
                        let targetSize = Math.min(size, MAX_DIM);

                        canvas.width = targetSize;
                        canvas.height = targetSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, xOffset, yOffset, size, size, 0, 0, targetSize, targetSize);

                        const blob = await canvasToJpegBlobUnder1MB(canvas);
                        resolve(blob);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });

            const fileName = `market/${user.uid}/${Date.now()}_${index}.jpg`;
            const storageRef = firebase.storage().ref(fileName);
            const snapshot = await storageRef.put(processedBlob);
            const url = await snapshot.ref.getDownloadURL();

            uploadedPhotos.push(url);
            renderPhotoSlots();
            document.getElementById('photos-error').classList.add('hidden');
        } catch (error) {
            alert("Upload failed: " + error.message);
            renderPhotoSlots();
        }
    }

    window.removePhoto = (index) => {
        uploadedPhotos.splice(index, 1);
        renderPhotoSlots();
    };

    const validateForm = (showErrors = false) => {
        const title = document.getElementById('item-title').value.trim();
        const price = document.getElementById('item-price').value.trim();
        const category = document.getElementById('item-category').value;
        const description = descInput.value.trim();
        const location = document.getElementById('item-location').value.trim();

        const isTitleValid = title.length > 0;
        const isPriceValid = price.length > 0 && parseFloat(price) >= 0;
        const isCategoryValid = category !== '';
        const isDescriptionValid = description.length > 0;
        const isLocationValid = location.length > 0;
        const isPhotosValid = uploadedPhotos.length > 0;

        if (showErrors) {
            document.getElementById('title-error').classList.toggle('hidden', isTitleValid);
            document.getElementById('price-error').classList.toggle('hidden', isPriceValid);
            document.getElementById('category-error').classList.toggle('hidden', isCategoryValid);
            document.getElementById('description-error').classList.toggle('hidden', isDescriptionValid);
            document.getElementById('location-error').classList.toggle('hidden', isLocationValid);
            document.getElementById('photos-error').classList.toggle('hidden', isPhotosValid);
        } else {
            if (isTitleValid) document.getElementById('title-error').classList.add('hidden');
            if (isPriceValid) document.getElementById('price-error').classList.add('hidden');
            if (isCategoryValid) document.getElementById('category-error').classList.add('hidden');
            if (isDescriptionValid) document.getElementById('description-error').classList.add('hidden');
            if (isLocationValid) document.getElementById('location-error').classList.add('hidden');
            if (isPhotosValid) document.getElementById('photos-error').classList.add('hidden');
        }

        return isTitleValid && isPriceValid && isCategoryValid && isDescriptionValid && isLocationValid && isPhotosValid;
    };

    async function loadItemData() {
        if (!editingId) return;

        try {
            const doc = await firebase.firestore().collection('poortjie').doc('market').collection('items').doc(editingId).get();
            if (doc.exists) {
                const data = doc.data();
                const user = firebase.auth().currentUser;

                if (user && data.userId !== user.uid) {
                    alert("Unauthorized access.");
                    window.location.href = '../market.html';
                    return;
                }

                document.getElementById('item-title').value = data.title;
                document.getElementById('item-price').value = data.price;
                document.getElementById('item-category').value = data.category;
                descInput.value = data.description;
                document.getElementById('item-location').value = data.location;
                uploadedPhotos = data.images || [];

                pageTitle.textContent = "Edit your listing";
                submitBtnText.textContent = "Update Listing";
                descCounter.textContent = `${descInput.value.length}/500`;
                renderPhotoSlots();
            }
        } catch (error) {
            console.error("Error loading item:", error);
        }
    }

    form.onsubmit = async (e) => {
        e.preventDefault();

        if (!validateForm(true)) {
            const firstError = document.querySelector('p[id$="-error"]:not(.hidden)');
            if (firstError) {
                firstError.parentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            return;
        }

        const user = firebase.auth().currentUser;
        if (!user) {
            alert("Please login first.");
            return;
        }

        submitBtn.disabled = true;
        submitBtnText.textContent = editingId ? 'Updating...' : 'Posting...';

        const data = {
            userId: user.uid,
            sellerName: user.displayName || 'Anonymous',
            sellerPhone: '',
            sellerPhoto: user.photoURL || '',
            title: document.getElementById('item-title').value.trim(),
            price: document.getElementById('item-price').value,
            category: document.getElementById('item-category').value,
            description: descInput.value.trim(),
            location: document.getElementById('item-location').value.trim(),
            images: uploadedPhotos,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (!editingId) {
            data.status = 'active';
            data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        }

        try {
            const userDoc = await firebase.firestore().collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                data.sellerPhone = userDoc.data().phone || '';
                data.sellerName = userDoc.data().displayName || data.sellerName;
            }

            if (editingId) {
                await firebase.firestore().collection('poortjie').doc('market').collection('items').doc(editingId).update(data);
            } else {
                await firebase.firestore().collection('poortjie').doc('market').collection('items').add(data);
            }

            alert(editingId ? "Listing updated!" : "Item posted successfully!");
            window.location.href = '../market.html';
        } catch (error) {
            console.error(error);
            alert("Action failed.");
            submitBtn.disabled = false;
            submitBtnText.textContent = editingId ? "Update Listing" : "Post Item";
        }
    };

    [document.getElementById('item-title'), document.getElementById('item-price'), document.getElementById('item-category'), descInput, document.getElementById('item-location')].forEach(el => {
        el.addEventListener('input', () => {
            if (el === descInput) {
                descCounter.textContent = `${descInput.value.length}/500`;
            }
            validateForm(false);
        });
    });

    firebase.auth().onAuthStateChanged(user => {
        if (!user) {
            sessionStorage.setItem('redirectUrl', window.location.href);
            window.location.href = '../authentication/login.html';
        } else {
            safeHideLoader();
            loadItemData();
        }
    });

    window.onload = () => {
        setTimeout(safeHideLoader, 3000);
    };

    renderPhotoSlots();
</script>
</body>
</html>
